  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&amp;family=Baloo+2:wght@600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #24544b;
      --garden: #79cf74;
      --sky: #bfeeff;
      --cream: #fffdf1;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      margin: 0;
      overflow-x: hidden;
      font-family: "Alegreya Sans", sans-serif;
      color: var(--ink);
    }

    .garden-page {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(to bottom, #bfeeff 0%, #e0f8ff 55%, #a8df83 55%, #78c971 100%);
    }

    .garden-page::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .28;
      background-image: radial-gradient(#ffffff 1.4px, transparent 1.4px);
      background-size: 19px 19px;
      pointer-events: none;
    }

    .main-shell {
      width: 100%;
      max-width: 590px;
      margin: 0 auto;
      padding: 25px 18px 42px;
      position: relative;
      z-index: 2;
    }

    .brand-logo {
      width: min(224px, 64vw);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 6px 0 rgba(40, 116, 80, .14));
      animation: floaty 3.2s ease-in-out infinite;
    }

    .slogan {
      font-family: "Baloo 2", cursive;
      text-shadow: 0 3px 0 rgba(255,255,255,.85);
    }

    .learning-card {
      border: 3px solid rgba(255, 255, 255, .92);
      border-radius: 30px;
      box-shadow: 0 11px 0 rgba(43, 111, 62, .18), 0 18px 25px rgba(53, 126, 79, .15);
      backdrop-filter: blur(5px);
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .level-button {
      min-height: 92px;
      border: 0;
      border-radius: 23px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 7px 0 rgba(0,0,0,.16);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      font-family: "Baloo 2", cursive;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .level-button::after {
      content: "";
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      right: -25px;
      top: -28px;
    }

    .level-button:hover,
    .level-button:focus-visible {
      transform: translateY(-5px) rotate(-1deg);
      filter: brightness(1.05);
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    .level-button:disabled {
      cursor: not-allowed;
      filter: saturate(.62);
      opacity: .78;
    }

    .level-button:active,
    .level-button.is-selected {
      transform: translateY(5px);
      box-shadow: inset 0 2px 0 rgba(0,0,0,.08), 0 2px 0 rgba(0,0,0,.16);
    }

    .level-button.is-selected {
      outline: 4px solid #fff9b4;
      outline-offset: 2px;
    }

    .button-number {
      width: 31px;
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.92);
      color: #27624f;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 2px;
      position: relative;
      z-index: 1;
    }

    .button-label {
      display: block;
      position: relative;
      z-index: 1;
      line-height: 1;
    }

    .message-card {
      border: 2px dashed rgba(55, 122, 78, .3);
      border-radius: 19px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      animation: pop-in .3s ease both;
    }

    .message-card[hidden] { display: none; }

    .sun {
      position: absolute;
      width: 76px;
      height: 76px;
      top: 19px;
      right: max(3%, calc((100% - 650px) / 2));
      border-radius: 50%;
      background: #ffd95a;
      border: 4px solid #ffca3f;
      box-shadow: 0 0 0 9px rgba(255, 227, 112, .34);
      z-index: 0;
    }

    .sun::before, .sun::after {
      content: "";
      position: absolute;
      height: 6px;
      width: 6px;
      background: #a66535;
      border-radius: 50%;
      top: 28px;
    }

    .sun::before { left: 20px; }
    .sun::after { right: 20px; }

    .sun-smile {
      position: absolute;
      left: 27px;
      top: 39px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #a66535;
      border-radius: 0 0 20px 20px;
    }

    .cloud {
      position: absolute;
      border-radius: 50px;
      background: rgba(255,255,255,.9);
      height: 20px;
      width: 68px;
      z-index: 0;
      animation: drift 11s ease-in-out infinite alternate;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      bottom: 0;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before { width: 30px; height: 30px; left: 12px; }
    .cloud::after { width: 23px; height: 23px; left: 36px; }

    .cloud-one { left: 6%; top: 115px; }
    .cloud-two { right: 8%; top: 203px; transform: scale(.72); animation-delay: -5s; }

    .bush {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 100px;
      border-radius: 100% 100% 0 0;
      background: #59b866;
      z-index: 1;
    }

    .bush-left { left: -60px; }
    .bush-right { right: -70px; background: #67bd67; }

    .flower {
      position: absolute;
      z-index: 1;
      bottom: 23px;
      font-size: 2rem;
      filter: drop-shadow(0 2px 0 rgba(53,112,58,.13));
    }

    .flower-one { left: 8%; }
    .flower-two { right: 8%; bottom: 48px; font-size: 1.65rem; }
    .bird { position: absolute; top: 160px; left: 10%; color: #5087bd; z-index: 1; transform: rotate(-8deg); }
    .rabbit { position: absolute; right: 7%; bottom: 20px; z-index: 2; font-size: 2.7rem; transform: rotate(-5deg); }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes drift {
      from { transform: translateX(-8px); }
      to { transform: translateX(14px); }
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(.92) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (min-width: 540px) {
      .main-shell { padding-top: 32px; }
      .level-grid { gap: 17px; }
      .level-button { min-height: 102px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }

      const buttons = document.querySelectorAll(".level-button");
      const messages = document.querySelectorAll(".message-card");
      buttons.forEach((button) => {
        if (Number(button.dataset.level) > 3) {
          button.disabled = true;
          button.classList.add("is-upcoming");
          button.setAttribute("aria-label", "Iqra' " + button.dataset.level + ", akan datang");
        }
      });

      buttons.forEach((button) => { 
        button.addEventListener("click", () => {
          const selectedLevel = button.dataset.level;
          const lessonLinks = {
            "1": "https://sites.google.com/view/iqralevel1/hijaiyah",
            "2": "https://sites.google.com/view/iqra-l2/huruf-bersambung",
            "3": "https://sites.google.com/view/ainaziqra3/level-3-mad-asli"
          };

          if (lessonLinks[selectedLevel]) {
            window.open(lessonLinks[selectedLevel], "_blank", "noopener,noreferrer");
            return;
          }

          buttons.forEach((item) => {
            const isActive = item === button;
            item.classList.toggle("is-selected", isActive);
            item.setAttribute("aria-pressed", String(isActive));
          });

          messages.forEach((message) => {
            const isSelectedMessage = message.id === "iqra-" + selectedLevel + "-message";
            message.hidden = !isSelectedMessage;
          });
        });
      });

      buttons[0].classList.add("is-selected");
      buttons[0].setAttribute("aria-pressed", "true");
      for (let index = 1; index < buttons.length; index++) {
        buttons[index].setAttribute("aria-pressed", "false");
      }
    });
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW berdaftar!'))
        .catch(err => console.log('Ralat SW:', err));
    });
  }
</script>
